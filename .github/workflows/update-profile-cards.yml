name: Update Profile Cards

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub statistics and rank
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=danvric&show_icons=true&hide_rank=false&rank_icon=github&include_all_commits=true&theme=transparent&title_color=2b91bb&text_color=607d8b&icon_color=2b91bb&border_color=c9d9e5&ring_color=2b91bb
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate language distribution
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=danvric&layout=compact&langs_count=6&theme=transparent&title_color=2b91bb&text_color=607d8b&border_color=c9d9e5
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo "No profile card changes."
            exit 0
          fi
          git commit -m "chore: update profile cards"
          git push
